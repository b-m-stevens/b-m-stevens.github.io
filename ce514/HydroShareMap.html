
<html>
<head>
<link rel="stylesheet" href="https://b-m-stevens.github.io/ce514/leafletstyle.css">
<title>Leaflet Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>  
<aside>
    <a href="https://b-m-stevens.github.io/ce514" target="_blank" style="float: left;">
        <img src="https://icons.iconarchive.com/icons/johanchalibert/mac-osx-yosemite/512/launchpad-icon.png" alt="launchpad" style="width:32px; height:32px;">
    </a>
    <h1>HydroShare Leaflet Map</h1>
    <p>A8 HydroShare Map</p>
    <p>CE 514</p>
    <p>28 January 2025</p>
</aside>
<body>
    <h1 style="text-align: center;">Scotland/Ireland Sister Travels</h1>
    <div id="dropdown-container">
        <label for="location-select">Select a location: </label>
        <select id="location-select">
            <option value="">--Select--</option>
            <option value="missionareas">Mission Areas</option>
            <option value="placeslived">Places Lived</option>
            <option value="scotlandrivers">Rivers of Scotland</option>
        </select>
    </div>
    <div class="layer-controls">
        <button id="missionareas-toggle">Mission Areas</button>
        <button id="placeslived-toggle">Places Lived</button>
        <button id="scotlandrivers-toggle">Rivers of Scotland</button>
    </div>
    <div id="map" style="width: 100%; height: 600px;"></div>
    <script>
        var map = L.map('map').setView([55, -2], 4.5); // Centered on the UK

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        var scotlandrivers = L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-bf3d9967154b4cc880f792810ea6a286/wms', {
            layers: 'HS-bf3d9967154b4cc880f792810ea6a286:WatercourseLink',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        }).addTo(map);
        var missionareas = L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-bf3d9967154b4cc880f792810ea6a286/wms', {
            layers: 'HS-bf3d9967154b4cc880f792810ea6a286:Mission_Areas',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        }).addTo(map);

        var placeslived = L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-bf3d9967154b4cc880f792810ea6a286/wms', {
            layers: 'HS-bf3d9967154b4cc880f792810ea6a286:Places_Lived',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        }).addTo(map);
        
        var locations = {
            missionareas: { layer: missionareasLayer, lat: 55.00, lng: -2.00, zoom: 5 },
            placeslived: { layer: placeslivedLayer, lat: 55.00, lng: -2.00, zoom: 5  },
            scotlandrivers: { layer: scotlandriversLayer, lat: 55.00, lng: -2.00, zoom: 5 }
        };
        document.getElementById('location-select').addEventListener('change', function() {
            var selectedLocation = this.value;
            if (selectedLocation && locations[selectedLocation]) {
                var loc = locations[selectedLocation];
                map.setView([loc.lat, loc.lng], loc.zoom);
                // Show only the selected layer and hide the others
                for (const location in locations) {
                    if (locations.hasOwnProperty(location)) {
                        const otherLoc = locations[location];
                        if (otherLoc.layer !== loc.layer) {
                            map.removeLayer(otherLoc.layer);
                        } else if (!map.hasLayer(loc.layer)) {  // Add layer if not already on the map
                            loc.layer.addTo(map);
                        }
                    }
                }

            } else { // If no location is selected, you might want to remove all WMS layers.
                for (const location in locations) {
                    if (locations.hasOwnProperty(location)) {
                        map.removeLayer(locations[location].layer);
                    }
                }
            }
        });

        // Toggle button functionality
        document.getElementById('missionareas-toggle').addEventListener('click', function() {
            toggleLayer(missionareasLayer);
        });
        document.getElementById('placeslived-toggle').addEventListener('click', function() {
            toggleLayer(placeslivedLayer);
        });
        document.getElementById('scotlandrivers-toggle').addEventListener('click', function() {
            toggleLayer(scotlandriversLayer);
        });

        function toggleLayer(layer) {
            if (map.hasLayer(layer)) {
                map.removeLayer(layer);
            } else {
                map.addLayer(layer);
            }
        }
        
        //Logan Rasters
        netlayer.addTo(map);
        L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-a51c74b3a8734324a53bb2c29ae9df3b/wms', {
            layers: 'HS-a51c74b3a8734324a53bb2c29ae9df3b:Loganoutlet',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        }).addTo(map);
        const netlayer = L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-a51c74b3a8734324a53bb2c29ae9df3b/wms', {
            layers: 'HS-a51c74b3a8734324a53bb2c29ae9df3b:Logannet',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        });
        const wlayer = L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-a51c74b3a8734324a53bb2c29ae9df3b/wms', {
            layers: 'HS-a51c74b3a8734324a53bb2c29ae9df3b:Loganw',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        });
        wlayer.addTo(map);
        const demlayer = L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-a51c74b3a8734324a53bb2c29ae9df3b/wms', {
            layers: 'HS-a51c74b3a8734324a53bb2c29ae9df3b:Logan',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        });
        demlayer.addTo(map);
    </script>
</body>
</html>
