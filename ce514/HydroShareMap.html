
<html>
<head>
<link rel="stylesheet" href="https://b-m-stevens.github.io/ce514/leafletstyle.css">
<title>Leaflet Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>  
<aside>
    <a href="https://b-m-stevens.github.io/ce514" target="_blank" style="float: left;">
        <img src="https://icons.iconarchive.com/icons/johanchalibert/mac-osx-yosemite/512/launchpad-icon.png" alt="launchpad" style="width:32px; height:32px;">
    </a>
    <h1>HydroShare Leaflet Map</h1>
    <p>A8 HydroShare Map</p>
    <p>CE 514</p>
    <p>28 January 2025</p>
</aside>
<body>
    <div id="map" style="width: 100%; height: 600px;"></div>
    <script>
        var map = L.map('map').setView([55, -2], 4.5); // Centered on the UK

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-bf3d9967154b4cc880f792810ea6a286/wms', {
            layers: 'HS-bf3d9967154b4cc880f792810ea6a286:Mission_Areas',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        }).addTo(map);

        L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-bf3d9967154b4cc880f792810ea6a286/wms', {
            layers: 'HS-bf3d9967154b4cc880f792810ea6a286:Places_Lived',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        }).addTo(map);
        L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-bf3d9967154b4cc880f792810ea6a286/wms', {
            layers: 'HS-bf3d9967154b4cc880f792810ea6a286:WatercourseLink',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        }).addTo(map);
        //Logan Rasters
        netlayer.addTo(map);
        L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-a51c74b3a8734324a53bb2c29ae9df3b/wms', {
            layers: 'HS-a51c74b3a8734324a53bb2c29ae9df3b:Loganoutlet',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        }).addTo(map);
        const netlayer = L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-a51c74b3a8734324a53bb2c29ae9df3b/wms', {
            layers: 'HS-a51c74b3a8734324a53bb2c29ae9df3b:Logannet',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        });
        const wlayer = L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-a51c74b3a8734324a53bb2c29ae9df3b/wms', {
            layers: 'HS-a51c74b3a8734324a53bb2c29ae9df3b:Loganw',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        });
        wlayer.addTo(map);
        const demlayer = L.tileLayer.wms('https://geoserver.hydroshare.org/geoserver/HS-a51c74b3a8734324a53bb2c29ae9df3b/wms', {
            layers: 'HS-a51c74b3a8734324a53bb2c29ae9df3b:Logan',
            format: 'image/png',
            transparent: true,
            attribution: 'Hydroshare GeoServer'
        });
        demlayer.addTo(map);
    </script>
</body>
</html>
