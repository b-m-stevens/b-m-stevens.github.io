<!DOCTYPE html>
<html>
<head>
<title>Leaflet Map</title>
<link rel="stylesheet" href="https://b-m-stevens.github.io/ce514/leafletstyle.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-plugins/1.0.2/layer/kml/leaflet.kml.js"></script> 
</head>
<body>
<aside>
    <a href="https://b-m-stevens.github.io/ce514" target="_blank" style="float: left;">
        <img src="https://icons.iconarchive.com/icons/johanchalibert/mac-osx-yosemite/512/launchpad-icon.png" alt="launchpad" style="width:32px; height:32px;">
    </a>
    <h1>Interactive KML Leaflet Map</h1>
    <p>A5 Leaflet Map</p>
    <p>CE 514</p>
    <p>Updated: 3 February 2025</p>
</aside>
<div id="map" style="height: 400px;"></div>

<h2>How it's Done</h2>

<p>Download the Utah County Boundary kml file from <a href="https://opendata.gis.utah.gov/datasets/utah-county-boundaries/about" target=_blank>Utah GIS open data</a>. </p> 
<p>Walmart locations kml file. </p>

<script>
    var map = L.map('map').setView([40.2, -111.8], 9); // Centered roughly on Utah County

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { // Use a tile layer
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);


    // Load Utah County Boundary KML
    fetch('UtahCounty.kml') 
        .then(res => res.text())
        .then(kmltext => {
            const parser = new DOMParser();
            const kml = parser.parseFromString(kmltext, 'text/xml');
            const utahCountyLayer = new L.KML(kml);
            map.addLayer(utahCountyLayer);
            utahCountyLayer.bringToBack(); // Ensure county boundary is underneath other layers

            // Zoom to the Utah County boundary
            const bounds = utahCountyLayer.getBounds();
            if (bounds.isValid()) {
              map.fitBounds(bounds);
            }
        });

    // Load Walmart Locations KML
    fetch('UtahCountyWalmartLocations.kml') 
        .then(res => res.text())
        .then(kmltext => {
            const parser = new DOMParser();
            const kml = parser.parseFromString(kmltext, 'text/xml');
            const walmartLayer = new L.KML(kml);
            map.addLayer(walmartLayer);
        });
      
      // Load Mission Areas KML
    fetch('MissionAreas.kml') 
        .then(res => res.text())
        .then(kmltext => {
            const parser = new DOMParser();
            const kml = parser.parseFromString(kmltext, 'text/xml');
            const walmartLayer = new L.KML(kml);
            map.addLayer(walmartLayer);
        });
      // Load Mission Places Lived KML
    fetch('MissionPlacesLived.kml') 
        .then(res => res.text())
        .then(kmltext => {
            const parser = new DOMParser();
            const kml = parser.parseFromString(kmltext, 'text/xml');
            const walmartLayer = new L.KML(kml);
            map.addLayer(walmartLayer);
        });

</script>
</body>
</html>
