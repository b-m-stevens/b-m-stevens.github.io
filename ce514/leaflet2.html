<!DOCTYPE html>
<html>
<head>
  <title>Interactive Leaflet Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4njal7gKd0Gis1<ctrl61>x0L86KsnPNZ/tgp0a9qr2Z9+sVh/D4=="
    crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-ZHcU0ZZL/wojtC+lk7WpGIvpDwlp/7reYbhgfrqymQz="
    crossorigin=""></script>

  <style>
    #map {
      height: 400px; /* Adjust height as needed */
    }
  </style>
</head>
<body>

  <h1>Interactive Leaflet Map</h1>

  <div id="map"></div>

  <script>
    // Initialize the map
    var map = L.map('map').setView([37.7749, -122.4194], 13); // Initial location: San Francisco

    // Add a tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Add a marker
    var marker = L.marker([37.7749, -122.4194]).addTo(map);
    marker.bindPopup("<b>Hello from San Francisco!</b>").openPopup();
  </script>

  <p>
    Becky Steevns <br>
    A4 Leaflet Map <br>
    GIS 514 [Class Name]<br>
    23 January 2025 [Date]</p>

</body>
</html>
