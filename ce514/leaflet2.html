<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://b-m-stevens.github.io/ce514/leafletstlye.css">
  <title>Leaflet Map</title>
</head>
<body>

  <aside>
    <h1>Becky Stevens Leaflet Map</h1>
    <p>A5 Leaflet Map</p>
    <p>CE 514</p>
    <p>28 January 2025</p>
  </aside>

  <section>
    <h1></h1>
    <p></p>

    <div id="map" style="height: 400px;"></div> 

  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script>
    // Define some example markers with popups
    var markers = [
      {
        location: [38.9444, -104.7877], // Coordinates for 2111 Peacemaker 
        popupContent: "<h3>My House, In the middle of the street</h3><p>Latitude: 38.9444, Longitude: -104.7877</p>"
      },
      {
        location: [38.9498, -104.7725], // Coordinates for Rampart High School
        popupContent: "<h3>Rampart High School</h3><p>Latitude: 38.9498, Longitude: -104.7725</p>"
      },
      {
        location: [38.9578, -104.7709], // Coordinates for Lexington Building
        popupContent: "<h3>Church of Jesus Christ of Latter-Day Saints, Vistors Welcome</h3><p>Latitude: 38.9578, Longitude: -104.7709</p>"
      },
      {
        location: [38.8784, -104.8803], // Coordinates for Garden of the Gods
        popupContent: "<h3>Garden of the Gods</h3><p>Latitude: 38.8784, Longitude: -104.8803</p>"
      },
      {
        location: [38.9654, -104.7615], // Coordinates for John Venezia Park
        popupContent: "<h3>John Venezia Park</h3><p>Latitude: 38.9654, Longitude: -104.7615</p>"
      },
    ];

    // Initialize the map
    var map = L.map('map').setView([38.9514, -104.773678], 13); // Centered on northern Colorado Springs, CO, USA

    // Add a tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Add markers with popups to the map
    for (var i = 0; i < markers.length; i++) {
      var marker = L.marker(markers[i].location).addTo(map);
      marker.bindPopup(markers[i].popupContent);
    }
    // 1. Red Circle around my house
        var circle = L.circle([38.9444, -104.7877], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.5,
            radius: 700 // in meters
        }).addTo(map);
        circle.bindPopup("Provo, Utah");

        // 2. Blue Polyline between Provo and St. George
        //var polyline = L.polyline([
            //[40.2338, -111.6585], // Provo
            //[37.0965, -113.5684]  // St. George
        //], {
            //color: 'blue'
        //}).addTo(map);
        //polyline.bindPopup("A Road between Provo and St. George");

        // 3. Polygon representing my house shape
        var houseCoords = [
            [38.94465, -104.7878361],
            [38.94456667, -104.7875556],
            [38.944575, -104.7875361],
            [38.94477222, -104.7872167],
            [38.94473056, -104.7871722],
            [38.94450278, -104.7874],
            [38.94437778, -104.7874806],
            [38.94440833, -104.7878389]
        ];
        var polygon = L.polygon(houseCoords, {
            color: 'green',
            fillColor: '#0f0',
            fillOpacity: 0.3
        }).addTo(map);
        polygon.bindPopup("My House");
// Function to create a triangle marker
        function createTriangleIcon() {
            return L.divIcon({
                className: 'triangle',
                iconSize: [16, 16]
            });
        }
  </script>

</body>
</html>
