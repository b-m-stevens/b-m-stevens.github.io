<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://b-m-stevens.github.io/ce514/leafletstlye.css">
  <title>Page with Side Panel</title>
</head>
<body>

  <aside>
    <h1>Becky Stevens Leaflet Map</h1>
    <p>A5 Leaflet Map</p>
    <p>CE 514</p>
    <p>28 January 2025</p>
  </aside>

  <section>
    <h1></h1>
    <p></p>

    <div id="map" style="height: 400px;"></div> 

  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script>
    // Your Leaflet JavaScript code to initialize the map goes here
    var map = L.map('map').setView([37.7749, -122.4194], 13); // Example: Centered on San Francisco

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
  </script>

</body>
</html>
