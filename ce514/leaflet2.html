/**
 * Computes the Haversine distance between two points on Earth.
 * @param {number} lat1 Latitude of the first point.
 * @param {number} lng1 Longitude of the first point.
 * @param {number} lat2 Latitude of the second point.
 * @param {number} lng2 Longitude of the second point.
 * @returns {number} The distance between the two points in kilometers.
 */
function computeDistance(lat1, lng1, lat2, lng2) {
  const R = 6371; // Earth's radius in km

  const radLat1 = lat1 * Math.PI / 180;
  const radLng1 = lng1 * Math.PI / 180;
  const radLat2 = lat2 * Math.PI / 180;
  const radLng2 = lng2 * Math.PI / 180;

  const dLat = radLat2 - radLat1;
  const dLon = radLng2 - radLng1;

  const a = Math.sin(dLat / 2)**2 + Math.cos(radLat1) * Math.cos(radLat2) * Math.sin(dLon / 2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  const distance = R * c;

  return distance; // Return the distance instead of setting innerHTML directly
}

/**
 * Calculates intermediate points along a great circle path.
 * @param {number} lat1 Latitude of the starting point.
 * @param {number} lng1 Longitude of the starting point.
 * @param {number} lat2 Latitude of the ending point.
 * @param {number} lng2 Longitude of the ending point.
 * @param {number} [numSegments=100] The number of segments to divide the path into.
 * @returns {L.Polyline} A Leaflet polyline representing the great circle path.
 */
function createGreatCircle(map, lat1, lng1, lat2, lng2, numSegments = 100) {
  const R = 6371; // Earth's radius in kilometers

  const radLat1 = lat1 * Math.PI / 180;
  const radLng1 = lng1 * Math.PI / 180;
  const radLat2 = lat2 * Math.PI / 180;
  const radLng2 = lng2 * Math.PI / 180;

  const dLat = radLat2 - radLat1;
  const dLon = radLng2 - radLng1;

  const angularDistance = 2 * Math.asin(Math.sqrt(Math.sin(dLat / 2)**2 + Math.cos(radLat1) * Math.cos(radLat2) * Math.sin(dLon / 2)**2)); //Simplified angular distance calculation

  const points = [[lat1, lng1]]; // Start with the initial point

  for (let i = 1; i <= numSegments; i++) {
    const f = i / numSegments;

    const A = Math.sin((1 - f) * angularDistance) / Math.sin(angularDistance);
    const B = Math.sin(f * angularDistance) / Math.sin(angularDistance);

    const x = A * Math.cos(radLat1) * Math.cos(radLng1) + B * Math.cos(radLat2) * Math.cos(radLng2);
    const y = A * Math.cos(radLat1) * Math.sin(radLng1) + B * Math.cos(radLat2) * Math.sin(radLng2);
    const z = A * Math.sin(radLat1) + B * Math.sin(radLat2);

    const newLat = Math.atan2(z, Math.sqrt(x**2 + y**2)) * 180 / Math.PI;
    const newLng = Math.atan2(y, x) * 180 / Math.PI;

    points.push([newLat, newLng]);
  }

  const polyline = L.polyline(points, { color: 'red' }).addTo(map); // Make sure 'map' is defined
		map.fitBounds(polyline.getBounds());
  return polyline;
}

document.getElementById("compute_distance").addEventListener("click", function() {
  const lat1 = parseFloat(document.getElementById("lat1").value);
  const lng1 = parseFloat(document.getElementById("lng1").value);
  const lat2 = parseFloat(document.getElementById("lat2").value);

  const distance = computeDistance(lat1, lng1, lat2, lng2);

    });
