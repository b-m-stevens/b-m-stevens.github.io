<html>
<head>
<link rel="stylesheet" href="https://b-m-stevens.github.io/style.css">
<title>Becky's First Unit Converter</title>
</head>
<body>

<script>
function convertUnits() {
  let inputnumber = parseFloat(document.getElementById("inputnumber").value);
  let inputunits = document.getElementById("units").value;
  let outputunits = document.getElementById("outputunits").value;
  
  let conversionFactors = {
    "mm": { "in": 0.03937, "ft": 0.00328, "mi": 0.000002, "m": 0.001 },
    "m": { "in": 39.37, "ft": 3.28, "mi": 0.000621, "mm": 1000 },
    "in": { "mm": 25.4, "ft": 0.0833, "mi": 0.000015, "m": 0.0254 },
    "ft": { "mm": 304.8, "in": 12, "mi": 0.000189, "m": 0.3048 },
    "mi": { "mm": 1.609e+6, "in": 63360, "ft": 5280, "m": 1609.34 }
  };

  // Directly convert from input units to output units using conversion factor
  let outputnumber = inputnumber * conversionFactors[inputunits][outputunits];

  // Round the output to 3 significant digits
  outputnumber = outputnumber.toPrecision(4); 

  // Update the output value in the input field
  document.getElementById("outputvalue").value = outputnumber + " " + outputunits;
}

function updateInputFromOutput() {
  let output = document.getElementById("outputvalue").value;
  let inputnumber = output.split(' ')[0]; // Extract the numeric value
  document.getElementById("inputnumber").value = inputnumber;
}
</script>

<h1>
Unit Converter
</h1>

Input Value: <input type="number" id="inputnumber">

<br>
Input Units:
<select id="units" name="units">
  <option value="in">Inches</option>
  <option value="mm">Millimeters</option>
  <option value="mi">Miles</option>
  <option value="ft">Feet</option>
</select>

<br><br>

Output Units:
<select id="outputunits" name="outputunits">
  <option value="mm">Millimeters</option>
  <option value="m">Meters</option>
  <option value="in">Inches</option>
  <option value="ft">Feet</option>
  <option value="mi">Miles</option>
</select>

<br><br>

<input type="submit" onclick="convertUnits()">

<br><br>

Output Value: <input type="text" id="outputvalue" value="12" onchange="updateInputFromOutput()" /> 

</body>
</html>
