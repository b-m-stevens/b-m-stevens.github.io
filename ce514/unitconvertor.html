<html>
<head>
<title>Becky's First Unit Converter</title>
</head>
<body>

<script>
function convertUnits() {
    let inputnumber = parseFloat(document.getElementById("inputnumber").value);
    let inputunits = document.getElementById("units").value;
    let outputunits = document.getElementById("outputunits").value;
    
    let conversionFactors = {
        "mm": 0.001,
        "m": 1,
        "in": 0.0254,
        "ft": 0.3048,
        "mi": 1609.34
    };

    // Convert input to meters first
    let inputInMeters = inputnumber * conversionFactors[inputunits];
    
    // Now convert from meters to the selected output unit
    let outputnumber = 0;
    if (outputunits == "mm") {
        outputnumber = inputInMeters / 0.001;
    } else if (outputunits == "m") {
        outputnumber = inputInMeters;
    } else if (outputunits == "in") {
        outputnumber = inputInMeters / 0.0254;
    } else if (outputunits == "ft") {
        outputnumber = inputInMeters / 0.3048;
    } else if (outputunits == "mi") {
        outputnumber = inputInMeters / 1609.34;
    }
    
    // Update the output value in the input field
    document.getElementById("outputvalue").value = outputnumber + " " + outputunits;
}

function updateInputFromOutput() {
    let output = document.getElementById("outputvalue").value;
    let inputnumber = output.split(' ')[0]; // Extract the numeric value
    document.getElementById("inputnumber").value = inputnumber;
}
</script>

<h1>
Unit Converter
</h1>

Input Value: <input type="text" id="inputnumber">

<br>
Input Units:
<select id="units" name="units">
    <option value="in">Inches</option>
    <option value="mm">Millimeters</option>
    <option value="mi">Miles</option>
    <option value="ft">Feet</option>
</select>

<br><br>

Output Units:
<select id="outputunits" name="outputunits">
    <option value="mm">Millimeters</option>
    <option value="m">Meters</option>
    <option value="in">Inches</option>
    <option value="ft">Feet</option>
    <option value="mi">Miles</option>
</select>

<br><br>

<input type="submit" onclick="convertUnits()">

<br><br>

Output Value: <input type="text" id="outputvalue" value="12 m" onchange="updateInputFromOutput()" />

</body>
</html>
